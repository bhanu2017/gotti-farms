# Netlify settings for Gotti Farms

[build]
  publish = "public"          # the website files
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

# The page renderer (pages.mjs) reads these page templates at run time
[functions.pages]
  included_files = ["public/index.html", "public/shop.html", "public/product.html", "public/blog-post.html", "public/404.html"]

# Article links (/blog/…, /recipes/…), product pages (/product/…) and /sitemap.xml are built by
# netlify/functions/pages.mjs, so they need no redirect rules here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
